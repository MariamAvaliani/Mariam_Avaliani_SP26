AWSTemplateFormatVersion: '2010-09-09'
Description: >
  Task 2 - Recreates the EC2 instance setup (mariam-avaliani-db-ec2 equivalent):
  t2.micro, 8GB root volume, separate 10GB data volume, SSH-Access-SG security group,
  AWS_EC2_full_access_S3 IAM instance profile, IMDSv2 required.

Resources:

  EC2Instance:
    Type: AWS::EC2::Instance
    Properties:
      ImageId: '{{resolve:ssm:/aws/service/ami-amazon-linux-latest/al2023-ami-kernel-default-x86_64}}'
      InstanceType: t2.micro
      KeyName: mariam-avaliani-key
      SubnetId: subnet-08b167bbfa25c0bdd
      SecurityGroupIds:
        - sg-0c9e0944abff93553
      IamInstanceProfile: AWS_EC2_full_access_S3
      MetadataOptions:
        HttpEndpoint: enabled
        HttpTokens: required
      BlockDeviceMappings:
        - DeviceName: /dev/xvda
          Ebs:
            VolumeSize: 8
            VolumeType: gp3
            DeleteOnTermination: true
      Tags:
        - Key: Name
          Value: mariam-avaliani-cfn-ec2
        - Key: owner
          Value: student

  DataVolume:
    Type: AWS::EC2::Volume
    Properties:
      Size: 10
      VolumeType: gp3
      AvailabilityZone: !GetAtt EC2Instance.AvailabilityZone
      Tags:
        - Key: Name
          Value: mariam-avaliani-cfn-data-volume
        - Key: owner
          Value: student

  DataVolumeAttachment:
    Type: AWS::EC2::VolumeAttachment
    Properties:
      InstanceId: !Ref EC2Instance
      VolumeId: !Ref DataVolume
      Device: /dev/sdb

Outputs:
  InstanceId:
    Description: EC2 Instance ID
    Value: !Ref EC2Instance
  PublicIp:
    Description: Public IP address
    Value: !GetAtt EC2Instance.PublicIp
